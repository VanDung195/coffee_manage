services:
    app:
        image: ${REGISTRY_URL}/${REGISTRY_USER}/${CI_PROJECT_NAME}:${CI_COMMIT_TAG}_${CI_COMMIT_SHORT_SHA}
        container_name: app
        restart: always
        ports:
            - "9000:9000"
    webserver:
        image: nginx:1.27-alpine
        container_name: nginx
        restart: always
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www/html
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
    db:
        image: mariadb:10.6
        container_name: mariadb
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: coffee_manager
        ports:
            - "3306:3306"
